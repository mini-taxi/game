<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>СОБЕРИ ЗВЁЗДЫ</title>
<style>
:root{--bg:#1a0f3c;--ink:#fff;--yellow:#ffd21f;--deep:#2a1668;--mid:#3a1c8f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;box-sizing:border-box;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:360px;height:640px;border-radius:28px;overflow:hidden;box-shadow:0 0 0 4px #7a4cff,0 0 40px #7a4cff88;background:#2a1668}
canvas{display:block;width:360px;height:640px}
.abs{position:absolute}
#snd{left:12px;top:12px;width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--mid);color:#fff;font-size:15px;padding:0;cursor:pointer}
#score,#cnt{top:12px;height:34px;line-height:34px;border-radius:17px;background:#2a1668cc;border:2px solid #7a4cff;font-weight:900;font-size:16px;padding:0 12px;box-sizing:border-box;box-shadow:0 0 12px #7a4cff88}
#score{left:56px;font-size:14px;color:#cdbbff}
#cnt{right:12px;color:#fff}
#cnt b{color:var(--yellow);text-shadow:0 0 8px var(--yellow)}
#title{left:50%;top:54px;transform:translateX(-50%);transition:opacity .6s,transform .6s;white-space:nowrap;background:var(--yellow);color:var(--deep);font-weight:900;font-size:20px;letter-spacing:.5px;padding:6px 18px;border-radius:22px;border:3px solid #fff;box-shadow:0 0 20px #ffd21faa;animation:glow 2.4s ease-in-out infinite}
#title i{font-style:normal;position:absolute;top:-2px;font-size:26px;color:#ffd21f;text-shadow:0 0 6px #fff,0 0 12px #ffb300}
#title i:first-child{left:-22px}#title i:last-child{right:-22px}
@keyframes glow{50%{box-shadow:0 0 34px #ffd21f}}
#title.gone{opacity:0;transform:translateX(-50%) translateY(-24px);pointer-events:none;animation:none}
.ctl{bottom:22px;width:66px;height:66px;border-radius:50%;border:4px solid #fff;background:#3a1c8fdd;box-shadow:0 0 18px #7a4cffaa;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none}
.ctl:active,.ctl.on{background:#6a3be8;transform:scale(.94)}
#bl{left:22px}#br{right:22px}
.ctl svg{width:30px;height:30px}
#br svg{transform:scaleX(-1)}
#ov{inset:0;display:flex;align-items:center;justify-content:center;background:#140a3c88;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:opacity .3s}
#ov.hide{opacity:0;pointer-events:none}
.card{width:270px;text-align:center;padding:22px 18px;border-radius:26px;background:linear-gradient(#4a24b8,#2a1668);border:4px solid var(--yellow);box-shadow:0 0 36px #ffd21f66;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.card h2{margin:0 0 8px;font-size:26px;color:var(--yellow);text-shadow:0 0 14px #ffd21f88;line-height:1.1}
.card p{margin:6px 0;color:#e6dcff;font-size:15px;line-height:1.35}
.big{font-size:54px;font-weight:900;line-height:1;margin:6px 0;text-shadow:0 0 16px #fff8}
.row{display:flex;justify-content:space-around;margin:10px 0 14px;font-weight:800}
.row span{display:block;font-size:12px;color:#b9a6f5;font-weight:700}
.nr{color:var(--yellow);font-weight:900;font-size:15px;animation:glow 1s infinite}
#go{margin-top:8px;border:0;border-radius:26px;background:linear-gradient(#ffe45c,#ffb300);color:var(--deep);font:900 22px "Nunito","Trebuchet MS",system-ui,sans-serif;padding:12px 34px;cursor:pointer;box-shadow:0 5px 0 #b57a00,0 0 24px #ffd21f99;animation:bump 1.4s ease-in-out infinite}
#go:active{transform:translateY(3px);box-shadow:0 2px 0 #b57a00}
@keyframes bump{50%{transform:scale(1.06)}}
.small{font-size:12px!important;color:#9d87e6!important}
</style></head><body>
<div id="stage">
<canvas id="c"></canvas>
<button id="snd" class="abs" aria-label="Звук">🔊</button>
<div id="score" class="abs">Счёт 0</div>
<div id="cnt" class="abs"><b>★</b> <span id="stars">0</span></div>
<div id="title" class="abs"><i>★</i>СОБЕРИ ЗВЁЗДЫ<i>★</i></div>
<button id="bl" class="ctl abs" aria-label="Влево"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4L7 12l8 8"/></svg></button>
<button id="br" class="ctl abs" aria-label="Вправо"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4L7 12l8 8"/></svg></button>
<div id="ov" class="abs"></div>
</div>
<script>
(function(){
const W=360,G=.36,JUMP=11.6;let H=640,CAM0=-440;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),stage=document.getElementById('stage'),ov=document.getElementById('ov');
const elScore=document.getElementById('score'),elStars=document.getElementById('stars'),snd=document.getElementById('snd');
let S=1;
function fit(){const b=document.body;const cw=b.clientWidth*.9,ch=b.clientHeight*.97;H=Math.max(600,Math.min(960,Math.round(W*ch/cw)));CAM0=200-H;S=Math.min(cw/W,ch/H);stage.style.height=H+'px';cv.style.height=H+'px';stage.style.transform='translate(-50%,-50%) scale('+S+')';const k=Math.min(window.devicePixelRatio||1,1.5)*S;cv.width=Math.round(W*k);cv.height=Math.round(H*k);}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',fit);fit();

/* ---------- audio ---------- */
let ac=null,mute=false;
function au(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}}
function tone(f,d,type,v,delay,slide){if(!ac||mute)return;const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03);}
const sfx={jump:()=>tone(380,.13,'square',.04,0,2),star:()=>[880,1175,1568].forEach((f,i)=>tone(f,.2,'triangle',.1,i*.06)),crumble:()=>tone(180,.2,'sawtooth',.05,0,.4),over:()=>[523,440,370,294].forEach((f,i)=>tone(f,.25,'sawtooth',.06,i*.15)),start:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.09,i*.07))};
snd.addEventListener('click',e=>{au();mute=!mute;snd.textContent=mute?'🔇':'🔊';});

/* ---------- storage ---------- */
let best=0;try{best=+localStorage.getItem('sobery-zvezdy-best')||0;}catch(e){}
function saveBest(){try{localStorage.setItem('sobery-zvezdy-best',String(best));}catch(e){}}

/* ---------- background ---------- */
function mkLayer(minH,maxH,col,win){const c=document.createElement('canvas');c.width=W;c.height=320;const x=c.getContext('2d');let px=-10;while(px<W){const w=26+Math.random()*34,h=minH+Math.random()*(maxH-minH);x.fillStyle=col;x.fillRect(px,320-h,w,h);if(Math.random()<.3)x.fillRect(px+w/2-1,320-h-14,2,14);if(win){for(let wy=320-h+8;wy<314;wy+=12)for(let wx=px+5;wx<px+w-6;wx+=9){if(Math.random()<.42){x.fillStyle=Math.random()<.8?'#ffd76a':'#8fe3ff';x.globalAlpha=.5+Math.random()*.45;x.fillRect(wx,wy,4,6);x.globalAlpha=1;}}}px+=w+Math.random()*6;}return c;}
const far=mkLayer(120,230,'#3d2a95',false),near=mkLayer(70,270,'#241466',true);
const twk=Array.from({length:55},()=>({x:Math.random()*W,y:Math.random()*960,r:.6+Math.random()*1.2,p:Math.random()*6}));
const bgc=[{x:40,y:120,w:110,s:.12},{x:250,y:300,w:90,s:.2},{x:120,y:470,w:130,s:.16},{x:300,y:40,w:80,s:.1}];
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function puff(g,x,y,w,col){g.fillStyle=col;g.beginPath();[[.2,.5,.22],[.45,.3,.3],[.72,.45,.25],[.9,.6,.15],[.08,.65,.12]].forEach(a=>{const cx=x+w*a[0],cy=y+w*a[1]*.5,r=w*a[2]*.8;g.moveTo(cx+r,cy);g.arc(cx,cy,r,0,6.2832);});g.fill();}
function mks(w,h){const c=document.createElement('canvas');c.width=w*2;c.height=h*2;const x=c.getContext('2d');x.scale(2,2);return{c,x,w,h};}
function di(s,x,y){ctx.drawImage(s.c,x,y,s.w,s.h);}
function sp(g,cx,cy,r){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.5:r;g[i?'lineTo':'moveTo'](cx+Math.cos(a)*q,cy+Math.sin(a)*q);}g.closePath();}
let bgSpr=null;
function mkBg(){
  const s=mks(W,H),g=s.x.createLinearGradient(0,0,0,H);
  // Smooth day/night cycle: each phase lasts about 35 seconds.
  const phase=(time%2400)/2400;
  const stops=[
    ['#ffb36b','#ffe0a1','#f8c7a1'], // sunrise
    ['#4ca8e8','#9de2ff','#e2f7ff'], // day
    ['#ef8b83','#f8b7a0','#f5d2bd'], // sunset
    ['#101a46','#263b75','#4c5d99']  // night
  ];
  const p=phase*4, base=Math.floor(p), i=((base%4)+4)%4, f=p-base, a=stops[i]||stops[0], b=stops[(i+1)%4]||stops[0];
  const mix=(u,v,t)=>{u=parseInt(u.slice(1),16);v=parseInt(v.slice(1),16);const r=Math.round(((u>>16)&255)*(1-t)+((v>>16)&255)*t),gg=Math.round(((u>>8)&255)*(1-t)+((v>>8)&255)*t),bb=Math.round((u&255)*(1-t)+(v&255)*t);return 'rgb('+r+','+gg+','+bb+')';};
  g.addColorStop(0,mix(a[0],b[0],f));g.addColorStop(.55,mix(a[1],b[1],f));g.addColorStop(1,mix(a[2],b[2],f));
  s.x.fillStyle=g;s.x.fillRect(0,0,W,H);bgSpr=s;
}
const moonSpr=(()=>{const s=mks(100,100),x=s.x,g=x.createRadialGradient(50,50,10,50,50,48);g.addColorStop(0,'rgba(255,243,168,.45)');g.addColorStop(1,'rgba(255,243,168,0)');x.fillStyle=g;x.fillRect(0,0,100,100);x.save();x.fillStyle='#fff3b0';x.beginPath();x.arc(50,50,22,0,6.2832);x.clip();x.beginPath();x.rect(20,20,60,60);x.arc(60,45,18,0,6.2832);x.fill('evenodd');x.restore();return s;})();
const cloudBg=bgc.map(c=>{const s=mks(Math.ceil(c.w*1.2),Math.ceil(c.w*.6));puff(s.x,c.w*.05,c.w*.12,c.w,'rgba(160,120,240,.45)');return s;});
const starSpr=(()=>{const s=mks(64,64),x=s.x;x.translate(32,32);x.shadowColor='#ffd21f';x.shadowBlur=18;x.fillStyle='#ffe45c';x.strokeStyle='#ffb300';x.lineWidth=2;x.lineJoin='round';sp(x,0,0,14);x.fill();x.shadowBlur=0;x.stroke();x.fillStyle='rgba(255,255,255,.55)';sp(x,-2,-2,5);x.fill();return s;})();
const glowSpr=(()=>{const s=mks(100,100),x=s.x,g=x.createRadialGradient(50,50,6,50,50,50);g.addColorStop(0,'rgba(255,210,31,.5)');g.addColorStop(1,'rgba(255,210,31,0)');x.fillStyle=g;x.fillRect(0,0,100,100);return s;})();
function drawBg(){
 const sh=CAM0-camY;
 if(!bgSpr||bgSpr.h!==H)mkBg();
 di(bgSpr,0,0);
 ctx.fillStyle='#fff';
 for(const s of twk){const y=(s.y+sh*.08)%H;ctx.globalAlpha=.4+.6*Math.abs(Math.sin(time*.04+s.p));ctx.fillRect(s.x,y,s.r*2,s.r*2);}
 ctx.globalAlpha=1;
 di(moonSpr,200,((130+sh*.05)%(H+80))-50);
 bgc.forEach((c,i)=>{const y=((c.y+sh*c.s*2.5+60)%(H+160))-80;di(cloudBg[i],c.x-c.w*.05,y-c.w*.12);});
 ctx.drawImage(far,0,H-280+sh*.16);
 ctx.drawImage(near,0,H-300+sh*.32);
}

/* ---------- state ---------- */
let state='ready',time=0,camY,P,plats,stars,parts,starCount,maxH,lastY,lastT,score,newRec=false;
const keys={l:0,r:0},touch={l:0,r:0};
const lvl=()=>Math.min(1,maxH/7000);
function reset(){plats=[];stars=[];parts=[];starCount=0;score=0;maxH=0;newRec=false;camY=CAM0;P={x:W/2,y:0,vx:0,vy:-JUMP,face:1,flap:0};lastY=16;lastT='n';plats.push({x:W/2-42,y:16,w:84,t:'n',vx:0});gen();hud();}
function gen(){while(lastY>camY-140){const lv=lvl();lastY-=55+lv*60+Math.random()*(20+lv*25);const w=Math.round((84-lv*28+Math.random()*10)*1.15),x=6+Math.random()*(W-w-12),r=Math.random();let t='n';if(lv>.12&&r<.14+lv*.3)t='m';else if(lv>.25&&lastT!=='c'&&r<.5+lv*.2&&r>.3)t='c';lastT=t;const p={x,y:lastY,w,t,vx:t==='m'?(Math.random()<.5?-1:1)*(.5+lv*.9):0};plats.push(p);if(Math.random()<.45)stars.push({x:x+w/2+(Math.random()-.5)*30,y:lastY-45-Math.random()*45,ph:Math.random()*6});if(Math.random()<.18)stars.push({x:20+Math.random()*(W-40),y:lastY+30,ph:Math.random()*6});}}
let hs=-1,hc=-1;function hud(){if(hs!==score){elScore.textContent='Счёт '+score;hs=score;}if(hc!==starCount){elStars.textContent=starCount;hc=starCount;}}
function burst(x,y,n,cols,sp){for(let i=0;i<n;i++){const a=Math.random()*6.2832,v=(.5+Math.random())*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:30+Math.random()*20,m:50,c:cols[i%cols.length],r:1.5+Math.random()*2.5});}}
function land(p){P.vy=-JUMP;sfx.jump();p.sq=1;burst(P.x,P.y+16,8,['#fff','#d9ccff','#ffe45c'],2.2);if(p.t==='c'&&!p.crumble){p.crumble=1;p.cl=0;sfx.crumble();}}

function update(dt){
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=.05*dt;q.l-=dt;if(q.l<=0)parts.splice(i,1);}
 if(state==='ready'){P.y=Math.sin(time*.07)*3;P.flap+=.2*dt;return;}
 if(state!=='play')return;
 const d=(keys.l||touch.l?-1:0)+(keys.r||touch.r?1:0);
 P.vx+=(d*4.4-P.vx)*Math.min(1,.1*dt);if(d)P.face=d;
 P.x+=P.vx*dt;if(P.x<-14)P.x=W+14;else if(P.x>W+14)P.x=-14;
 const f0=P.y+16;P.vy+=G*dt;P.y+=P.vy*dt;P.flap+=(P.vy<0?.36:.2)*dt;
 for(const p of plats){
  if(p.t==='m'&&!p.dead){p.x+=p.vx*dt;if(p.x<4){p.x=4;p.vx=Math.abs(p.vx);}if(p.x+p.w>W-4){p.x=W-4-p.w;p.vx=-Math.abs(p.vx);}}
  if(p.sq)p.sq=Math.max(0,p.sq-.08*dt);
  if(p.crumble&&!p.dead){p.cl+=dt;if(p.cl>14){p.dead=true;p.fv=0;p.fa=0;}}
  if(p.dead){p.fv+=.5*dt;p.y+=p.fv*dt;p.fa+=.04*dt;}
 }
 if(P.vy>0){const f1=P.y+16;for(const p of plats){if(p.dead)continue;if(f0<=p.y+4&&f1>=p.y&&P.x+17>p.x&&P.x-17<p.x+p.w){land(p);break;}}}
 if(time%3<dt&&parts.length<90)parts.push({x:P.x-P.face*18,y:P.y+6+Math.random()*6,vx:-P.face*.3,vy:.3,l:22,m:22,c:Math.random()<.5?'#ffe45c':'#fff',r:1.5+Math.random()*2});
 for(let i=stars.length-1;i>=0;i--){const s=stars[i];if(Math.hypot(P.x-s.x,P.y-s.y)<31){stars.splice(i,1);starCount++;sfx.star();burst(s.x,s.y,16,['#ffe45c','#fff','#ffb300'],3.4);elStars.parentNode.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:260});}}
 if(P.y<camY+H*.4)camY+=(P.y-H*.4-camY)*Math.min(1,.12*dt);
 maxH=Math.max(maxH,-P.y);score=Math.floor(maxH/10)+starCount*10;hud();
 gen();
 for(let i=plats.length-1;i>=0;i--)if(plats[i].y>camY+H+120)plats.splice(i,1);
 for(let i=stars.length-1;i>=0;i--)if(stars[i].y>camY+H+60)stars.splice(i,1);
 if(P.y-camY>H+40)die();
}
function die(){state='over';sfx.over();if(score>best){best=score;newRec=true;saveBest();}setTimeout(()=>showOver(),550);}

/* ---------- drawing ---------- */
const cloudCache={};
function cloudSprite(t,w){const k=t+w;if(cloudCache[k])return cloudCache[k];
 const s=mks(w+60,60),x=s.x,ox=30,oy=26;
 let c1='#fff',c2='#d9ccff',sc='#b79bff';if(t==='m'){c1='#e9fcff';c2='#9fe0ff';sc='#6fd6ff';}else if(t==='c'){c1='#ffeef5';c2='#f3a6c8';sc='#ff8fbf';}
 x.shadowColor=sc;x.shadowBlur=14;
 const g=x.createLinearGradient(0,oy-8,0,oy+17);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;
 x.beginPath();[[.27,4,10.4],[.55,1,13.8],[.8,5,9.2]].forEach(a=>{const cx=ox+w*a[0],cy=oy+a[1]+2;x.moveTo(cx+a[2],cy);x.arc(cx,cy,a[2],0,6.2832);});x.fill();
 x.beginPath();if(x.roundRect)x.roundRect(ox,oy+3,w,16,8);else x.rect(ox,oy+3,w,16);x.fill();
 if(t==='c'){x.shadowBlur=0;x.strokeStyle='#b0527f';x.lineWidth=1.5;x.beginPath();x.moveTo(ox+w*.4,oy+3);x.lineTo(ox+w*.46,oy+9);x.lineTo(ox+w*.4,oy+12);x.lineTo(ox+w*.48,oy+19);x.stroke();}
 s.ox=ox;s.oy=oy;return cloudCache[k]=s;}
function drawPlat(p){
 const s=cloudSprite(p.t,p.w),sy=p.y-camY+(p.sq||0)*3;let sx=p.x;if(p.crumble&&!p.dead)sx+=(Math.random()-.5)*3;
 if(p.dead){ctx.globalAlpha=Math.max(0,1-p.fa);di(s,sx-s.ox,sy-s.oy);ctx.globalAlpha=1;}else di(s,sx-s.ox,sy-s.oy);
}
function starPath(x,y,r,rot){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5+rot,q=i%2?r*.5:r;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*q,y+Math.sin(a)*q);}ctx.closePath();}

function drawTaxi(){
 ctx.save();ctx.translate(P.x,P.y-camY);ctx.scale(P.face,1);
 ctx.rotate(Math.max(-.18,Math.min(.18,P.vx*P.face*.03)));
 di(glowSpr,-50,-52);
 ctx.translate(0,17);ctx.scale(1.15,1.15);ctx.translate(0,-17);
 if(bodyImg.complete&&wingImg.complete){
  ctx.drawImage(bodyImg,-32,-21,64,41);
  ctx.save();ctx.translate(-5.7,-.85);ctx.rotate(.05+Math.sin(P.flap)*.3);ctx.translate(5.7,.85);ctx.drawImage(wingImg,-32,-21,64,41);ctx.restore();
 }
 ctx.restore();
}
function draw(){
 const k=cv.width/W;ctx.setTransform(k,0,0,cv.height/H,0,0);
 drawBg();
 for(const p of plats)drawPlat(p);
 for(const s of stars)drawStar(s);
 for(const q of parts){ctx.globalAlpha=Math.max(0,q.l/q.m);ctx.fillStyle=q.c;ctx.fillRect(q.x-q.r,q.y-camY-q.r,q.r*2,q.r*2);}
 ctx.globalAlpha=1;
 if(state!=='over'||P.y-camY<H+40)drawTaxi();
}

/* ---------- overlays ---------- */
function showStart(){ov.innerHTML='<div class="card"><h2>СОБЕРИ ЗВЁЗДЫ</h2><p>Двигайся влево и вправо,<br>собирай звёзды</p>'+(best?'<p><b>Рекорд: '+best+'</b></p>':'')+'<button id="go">Играть</button></div>';ov.classList.remove('hide');document.getElementById('go').onclick=start;}
function showOver(){ov.innerHTML='<div class="card"><h2>Игра окончена</h2>'+(newRec?'<div class="nr">★ Новый рекорд! ★</div>':'')+'<div class="big">'+score+'</div><p class="small" style="margin:0">очков</p><div class="row"><div><span>Звёзды</span>★ '+starCount+'</div><div><span>Рекорд</span>'+best+'</div></div><button id="go">Заново</button></div>';ov.classList.remove('hide');document.getElementById('go').onclick=start;}
function start(){au();sfx.start();reset();state='play';ov.classList.add('hide');document.getElementById('title').classList.add('gone');}

/* ---------- input ---------- */
addEventListener('keydown',e=>{
 if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.l=1;e.preventDefault();}
 else if(e.code==='ArrowRight'||e.code==='KeyD'){keys.r=1;e.preventDefault();}
 else if((e.code==='Enter'||e.code==='Space')&&state!=='play'&&!ov.classList.contains('hide')){e.preventDefault();start();}
});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=0;else if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=0;});
addEventListener('blur',()=>{keys.l=keys.r=touch.l=touch.r=0;});
function hold(id,dir){const b=document.getElementById(id);const on=e=>{au();touch[dir]=1;b.classList.add('on');e.preventDefault();e.stopPropagation();};const off=e=>{touch[dir]=0;b.classList.remove('on');};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,off));b.addEventListener('contextmenu',e=>e.preventDefault());}
hold('bl','l');hold('br','r');
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button')||state!=='play')return;const r=stage.getBoundingClientRect();const left=(e.clientX-r.left)<r.width/2;touch.l=left?1:0;touch.r=left?0:1;});
['pointerup','pointercancel'].forEach(n=>stage.addEventListener(n,e=>{if(!e.target.closest('button')){touch.l=touch.r=0;}}));
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- loop ---------- */
